[workspace]
resolver = "2"
members = [
    "crates/fastdev-common",
    "crates/fastdev-capture",
    "crates/fastdev-compile",
    "crates/fastdev-prep",
    "crates/fastdev-check",
    "crates/fastdev-gatekeeper",
    "crates/fastdev-diff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
fastdev-common = { path = "crates/fastdev-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "feature"] }
walkdir = "2"
toml = "0.8"
