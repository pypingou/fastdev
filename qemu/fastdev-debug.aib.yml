# Debug-logging variant of fastdev.aib.yml - adds verbose console logging
# (same kernel cmdline as qemu/baseline-debug.aib.yml) so boot phase
# transitions are visible on the serial console. Used only for the
# post-switch-root hotplug timing investigation, not part of the normal
# fastdev test pipeline. Otherwise identical to fastdev.aib.yml.

name: fastdev-test-debug

kernel:
  debug_logging: true
  cmdline:
    - "systemd.log_level=debug"
    - "systemd.log_target=console"
    - "systemd.journald.forward_to_console=1"
    - "rd.debug"
    - "udev.log_level=debug"

content:
  repos:
    - id: fastdev-local
      baseurl: file:///home/pierrey/tmp/fastdev/build/repo
      priority: 1

  rpms:
    - fastdev-prep
    - fastdev-data-qemu-x86_64
    - fastdev-usb
    - fastdev-tools
    - openssh-server

  add_files:
    - path: /etc/fastdev-board-id
      text: "qemu-x86_64"

  systemd:
    enabled_services:
      - sshd.service

auth:
  # "password" - test VM only, never use outside local dev/CI
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true
