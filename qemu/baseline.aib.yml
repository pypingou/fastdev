# Baseline image: stock systemd-udevd, no fastdev packages.
# Used only to capture ground-truth udev state for a given board/kernel
# revision (fastdev-capture).

name: fastdev-baseline

content:
  repos:
    - id: fastdev-local
      baseurl: file:///home/pierrey/tmp/fastdev/build/repo
      priority: 1
  rpms:
    - fastdev-tools
    # test-only, for pulling capture.json back out over SSH:
    - openssh-server

  systemd:
    enabled_services:
      - sshd.service

auth:
  # "password" - test VM only, never use outside local dev/CI
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true
