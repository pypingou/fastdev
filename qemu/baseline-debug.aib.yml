# Debug variant of baseline.aib.yml - adds verbose console logging so boot
# phase transitions (initrd -> real root) are visible on the serial console.
# Used only for the hotplug-timing investigation, not part of the normal
# fastdev test pipeline.

name: fastdev-baseline-debug

kernel:
  debug_logging: true
  cmdline:
    - "systemd.log_level=debug"
    - "systemd.log_target=console"
    - "systemd.journald.forward_to_console=1"
    - "rd.debug"
    - "udev.log_level=debug"

content:
  repos:
    - id: fastdev-local
      baseurl: file:///home/pierrey/tmp/fastdev/build/repo
      priority: 1
  rpms:
    - fastdev-tools
    # test-only, for pulling capture.json back out over SSH:
    - openssh-server

  systemd:
    enabled_services:
      - sshd.service

auth:
  # "password" - test VM only, never use outside local dev/CI
  root_password: $6$xoLqEUz0cGGJRx01$H3H/bFm0myJPULNMtbSsOFd/2BnHqHkMD92Sfxd.EKM9hXTWSmELG8cf205l6dktomuTcgKGGtGDgtvHVXSWU.
  sshd_config:
    PasswordAuthentication: true
    PermitRootLogin: true
